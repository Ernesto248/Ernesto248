<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Ernesto — Full Stack Developer</title>
  <desc id="desc">Dark blue banner with cyan and violet accents. Interfaces, APIs and data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="250" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="250" rx="20" fill="url(#grid)"/>
  <circle cx="1115" cy="55" r="133" fill="none" stroke="#22d3ee" stroke-opacity="0.28" stroke-width="2"/>
  <circle cx="1115" cy="55" r="95" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="1020" cy="220" r="145" fill="#a78bfa" fill-opacity="0.06"/>
  <rect x="54" y="48" width="9" height="151" rx="4.5" fill="url(#line)"/>
  <text x="92" y="109" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" letter-spacing="-2">ERNESTO</text>
  <text x="94" y="150" fill="#67e8f9" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="3">FULL STACK DEVELOPER</text>
  <text x="94" y="190" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="20">Interfaces  /  APIs  /  Datos</text>
</svg>
